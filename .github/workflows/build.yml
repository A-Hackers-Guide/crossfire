name: Build Crossfire

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine-tests:
    name: Engine tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: engine }
      - run: cargo test --manifest-path engine/Cargo.toml

  tauri:
    name: App · ${{ matrix.name }}
    needs: engine-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS (universal), os: macos-latest, args: '--target universal-apple-darwin', rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin' }
          - { name: Windows x64, os: windows-latest, args: '', rust_targets: '' }
          - { name: Linux x64, os: ubuntu-22.04, args: '--bundles appimage,deb,rpm', rust_targets: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.rust_targets }}' }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/tauri/src-tauri }
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - run: npm ci --prefix ui
      - run: npm ci --prefix apps/tauri
      - name: Build Tauri app
        working-directory: apps/tauri
        run: npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: crossfire-${{ runner.os }}
          path: |
            apps/tauri/src-tauri/target/**/release/bundle/dmg/*.dmg
            apps/tauri/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/tauri/src-tauri/target/**/release/bundle/msi/*.msi
            apps/tauri/src-tauri/target/**/release/bundle/appimage/*.AppImage
            apps/tauri/src-tauri/target/**/release/bundle/deb/*.deb
            apps/tauri/src-tauri/target/**/release/bundle/rpm/*.rpm
            apps/tauri/src-tauri/target/release/crossfire.exe

  freebsd:
    name: App · FreeBSD
    needs: engine-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build inside FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: '14.3'
          usesh: true
          prepare: pkg install -y rust node22 npm-node22 webkit2-gtk_41 gtk3 libsoup3 pkgconf
          run: |
            set -e
            cargo build --release --manifest-path engine/Cargo.toml
            npm ci --prefix ui && npm run build --prefix ui
            # Tauri has no FreeBSD bundler, so ship the raw binary plus the engine CLI.
            cargo build --release --manifest-path apps/tauri/src-tauri/Cargo.toml || echo "Tauri GUI build failed; shipping the engine CLI only"
            mkdir -p dist
            cp engine/target/release/crossfire-engine dist/
            [ -f apps/tauri/src-tauri/target/release/crossfire ] && cp apps/tauri/src-tauri/target/release/crossfire dist/ || true
            tar -czf crossfire-freebsd-amd64.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with: { name: crossfire-FreeBSD, path: crossfire-freebsd-amd64.tar.gz }

  electron:
    name: Backup app (Electron) · ${{ matrix.os }}
    needs: engine-tests
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: engine }
      - run: npm ci --prefix ui
      - run: npm install --prefix apps/electron
      - run: npm run dist --prefix apps/electron
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with:
          name: crossfire-electron-${{ runner.os }}
          path: |
            apps/electron/dist/*.dmg
            apps/electron/dist/*.exe
            apps/electron/dist/*.AppImage

  release:
    name: Publish release
    # Publish whatever built, even if one platform failed
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    needs: [tauri, freebsd, electron]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          fail_on_unmatched_files: false
          generate_release_notes: true
