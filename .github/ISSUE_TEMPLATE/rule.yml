name: Rule request
description: Add a detection/rewrite rule to the engine.
title: "[rule] "
labels: ["rule-request"]
body:
  - type: markdown
    attributes:
      value: |
        Rules are plain TOML — see the
        [rule-authoring guide](https://a-hackers-guide.github.io/crossfire/writing-rules/).
        If you can send a PR instead of an issue, even better.
  - type: input
    id: rule_id
    attributes:
      label: Proposed rule id
      description: "Convention: `<os>.<category>.<name>` (e.g. `win.timing.qpc`)."
      placeholder: "win.registry.regopenkeyex"
    validations:
      required: true
  - type: dropdown
    id: source_os
    attributes:
      label: Source OS this pattern is tied to
      multiple: true
      options:
        - windows
        - macos
        - linux
        - freebsd
        - any
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - window
        - audio
        - graphics
        - input
        - registry
        - filesystem
        - threading
        - timing
        - language
        - engine
        - build
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - block (code will not build or run on the target)
        - warn (builds but behaves differently)
        - info (idiomatic difference)
    validations:
      required: true
  - type: textarea
    id: pattern
    attributes:
      label: Regex or example that trips it
      description: The exact call / token we should match. A short code snippet is fine.
      render: text
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suggested fix per target OS
      description: Per target, what should the converted code look like?
    validations:
      required: false
  - type: input
    id: docs
    attributes:
      label: API reference link
      description: MSDN / man page / Apple docs URL for the API this covers.
    validations:
      required: false
