  { id = "rs.nix", api = "nix crate", re = '\buse\s+nix::', msg = "nix crate (Unix-only).", once = true, windows = "Use windows-sys / std equivalents behind #[cfg(windows)]." },
  { id = "rs.libc-unix", api = "libc::fork/signal", re = '\blibc::(fork|kill|signal|sigaction|getuid|mmap|dlopen|ioctl)\b', msg = "Unix libc calls.", once = true, windows = "Use std::process, libloading (dlopen), memmap2 (mmap), ctrlc (signals)." },
]

[[group]]
lang = ["rust"]
os = ["windows", "macos", "linux", "freebsd"]
cat = "build"
sev = "info"
fix = "Check that every target has a cfg branch (windows, macos, linux, freebsd) or a fallback."
rules = [
  { id = "rs.cfg-os", api = "#[cfg(target_os)]", re = '#\[cfg\(\s*(target_os\s*=|windows|unix|not\()', msg = "Platform-conditional Rust code.", once = true },
  { id = "rs.build-rs-link", api = "cargo:rustc-link-lib", re = 'cargo:rustc-link-(lib|search)=', msg = "build.rs links native libraries (names differ per OS).", sev = "medium" },
]

# --- Java / Kotlin -------------------------------------------------------------------
[[group]]
lang = ["java", "kotlin"]
os = ["windows"]
cat = "other"
sev = "medium"
fix = "The JVM is portable; keep native bits optional and resolve paths with System.getProperty(\"user.home\") / Path.of(...)."
rules = [
  { id = "java.jna-win32", api = "JNA win32", re = '\bcom\.sun\.jna\.platform\.win32\b|\bUser32\.INSTANCE\b|\bKernel32\.INSTANCE\b', msg = "JNA bindings to Win32.", sev = "blocker", fix = "Use JDK APIs (java.awt.Desktop, ProcessHandle, java.nio.file) or per-OS JNA code paths." },
  { id = "java.runtime-exec-cmd", api = "Runtime.exec(cmd)", re = '(Runtime\.getRuntime\(\)\.exec|new\s+ProcessBuilder)\s*\(\s*(new\s+String\[\]\s*\{\s*)?"(cmd(\.exe)?|powershell|rundll32|reg|tasklist|taskkill)', msg = "Launches Windows command tools.", cat = "process", fix = "Use Java APIs (Desktop.open/browse, ProcessHandle) or OS-specific commands." },
  { id = "java.appdata", api = "APPDATA env", re = 'System\.getenv\s*\(\s*"(APPDATA|LOCALAPPDATA|USERPROFILE|TEMP)"', msg = "Windows-only environment variables.", cat = "filesystem", fix = "Use System.getProperty(\"user.home\") + per-OS dirs (e.g. the directories-jvm library) and java.io.tmpdir." },
  { id = "java.prefs-registry", api = "WinRegistry hacks", re = '\bWindowsPreferences\b|\bWinRegistry\b', msg = "Registry access via reflection hacks.", cat = "registry", sev = "high", fix = "Use java.util.prefs.Preferences (backed by registry/plist/files per OS)." },
  { id = "java.swt-win32", api = "SWT win32", re = '\borg\.eclipse\.swt\.internal\.win32\b|\bswt-win32\b', msg = "SWT Windows internals.", cat = "ui", sev = "high", fix = "Use public SWT APIs and ship the per-OS SWT fragment (cocoa/gtk)." },
]

[[group]]
lang = ["java", "kotlin"]
os = ["windows", "macos", "linux", "freebsd"]
cat = "dynamicLibrary"
sev = "medium"
fix = "Ship native libraries for every OS/arch (lib<name>.so / lib<name>.dylib / <name>.dll), e.g. via a native-loader that extracts the right one from the jar."
rules = [
  { id = "java.jni-load", api = "System.loadLibrary", re = '\bSystem\.(loadLibrary|load)\s*\(', msg = "JNI native library loading." },
  { id = "java.jni-native", api = "native methods", re = '\b(public|private|protected|static)\s+(static\s+)?native\s+\w', msg = "JNI native method declarations.", once = true },
  { id = "java.os-name", api = "os.name", re = 'System\.getProperty\s*\(\s*"os\.name"\s*\)', msg = "OS detection — ensure every branch exists.", sev = "info", cat = "other", once = true },
]

# --- JavaScript / TypeScript (Node, Electron) -------------------------------------
[[group]]
lang = ["js"]
os = ["windows", "macos", "linux", "freebsd"]
cat = "other"
sev = "info"
fix = "Ensure each platform branch handles win32, darwin, linux and freebsd."
rules = [
  { id = "js.process-platform", api = "process.platform", re = '\bprocess\.platform\b|\bos\.platform\s*\(\s*\)', msg = "Platform branch.", once = true },
  { id = "js.native-addon", api = "native addon", re = '''\brequire\s*\(\s*['"](bindings|node-gyp-build|prebuild-install)['"]|\.node['"]\s*\)|\bnode-addon-api\b|\bnapi_\w+\s*\(''', msg = "Native Node addon (needs prebuilt binaries per OS/arch; FreeBSD usually builds from source).", sev = "medium", cat = "build", fix = "Use prebuildify / node-gyp-build with CI for every target, or a pure-JS/WASM alternative." },
  { id = "js.ffi", api = "ffi-napi / koffi", re = '''\brequire\s*\(\s*['"](ffi-napi|ffi|koffi|node-ffi)['"]|from\s+['"](koffi|ffi-napi)['"]''', msg = "FFI into native libraries.", sev = "medium", cat = "dynamicLibrary", fix = "Load per-OS library names; avoid system DLLs like user32." },
  { id = "js.path-sep", api = "path.win32 / backslashes", re = '''\bpath\.win32\b|\.split\s*\(\s*['"]\\\\['"]\s*\)|\.join\s*\(\s*['"]\\\\['"]\s*\)''', msg = "Windows path separator handling.", sev = "low", cat = "filesystem", fix = "Use path.join / path.sep / path.posix as appropriate." },
]

[[group]]
lang = ["js"]
os = ["windows"]
cat = "process"
sev = "medium"
fix = "Use Node APIs (fs, os, path) or per-OS commands behind process.platform."
rules = [
  { id = "js.exec-cmd", api = "child_process cmd", re = '''\b(exec|execSync|spawn|spawnSync|execFile)\s*\(\s*['"`](cmd(\.exe)?|powershell(\.exe)?|start |del |copy |taskkill|reg |wmic|where )''', msg = "Shells out to Windows commands." },
  { id = "js.win-registry", api = "registry npm packages", re = '''\brequire\s*\(\s*['"](winreg|regedit|registry-js|windows-registry)['"]|from\s+['"](winreg|regedit|registry-js)['"]''', msg = "Windows registry packages.", cat = "registry", sev = "high", fix = "Store settings in app.getPath('userData') (Electron) or a JSON file via env-paths." },
  { id = "js.appdata", api = "APPDATA env", re = 'process\.env\.(APPDATA|LOCALAPPDATA|USERPROFILE|ProgramData|TEMP)\b', msg = "Windows-only environment variables.", cat = "filesystem", fix = "Use os.homedir(), os.tmpdir(), env-paths, or Electron app.getPath()." },
  { id = "js.edge-js", api = "edge-js / winax", re = '''\brequire\s*\(\s*['"](edge-js|electron-edge-js|winax|node-windows)['"]''', msg = "Windows-only native bridges (.NET/COM/services).", sev = "blocker", cat = "other", fix = "Replace with cross-platform modules or a separate per-OS helper process." },
]

