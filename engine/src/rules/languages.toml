  { id = "rust.wayland",    api = "wayland-* crate",    re = '^\s*use\s+(wayland_client|wayland_server|wayland_protocols)::|^\s*wayland-(client|server|protocols)\s*=', msg = "Wayland client/server bindings.", lang = ["rust", "toml"], cat = "windowing" },
  { id = "rust.evdev",      api = "evdev crate",        re = '^\s*use\s+evdev::|^\s*evdev\s*=', msg = "Linux evdev input.", lang = ["rust", "toml"], cat = "input", fix = "Use gilrs or sdl2 for portable gamepad input." },
