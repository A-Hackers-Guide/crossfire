  { id = "js.applescript", api = "osascript", re = '''\bosascript\b|\brequire\s*\(\s*['"](run-applescript|node-mac-\w+|macos-\w+)['"]''', msg = "AppleScript / macOS-only modules.", sev = "high", os = ["macos"], fix = "Provide per-OS implementations (PowerShell on Windows, D-Bus on Linux)." },
]

