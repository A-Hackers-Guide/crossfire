  { id = "rs.epoll", api = "libc::epoll / inotify", re = '\blibc::(epoll_\w+|inotify_\w+|eventfd|timerfd_\w+)\b|\buse\s+(inotify|epoll)\b', msg = "Linux-only syscalls from Rust.", os = ["linux"], fix = "mio / tokio / polling (event loop), notify (file watching)." },
  { id = "rs.std-os-linux", api = "std::os::linux", re = '\bstd::os::linux\b', msg = "Linux-only std extensions.", os = ["linux"], sev = "medium" },
]

[[group]]
