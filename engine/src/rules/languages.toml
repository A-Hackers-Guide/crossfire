  { id = "rust.windows-rs", api = "windows-rs crate",   re = '^\s*use\s+windows::(Win32|UI|Foundation|System|Storage|Devices|Graphics|Media|Networking|Security)\b', msg = "windows-rs crate.", fix = "Prefer cross-platform crates; where a Win32 call is unavoidable, feature-gate it (#[cfg(windows)])." },
  { id = "rust.windows-sys",api = "windows-sys crate",  re = '^\s*use\s+windows_sys::(Win32|UI|Foundation|System|Storage|Devices|Graphics|Media|Networking|Security)\b', msg = "windows-sys crate (raw FFI).", fix = "Same guidance as windows-rs." },
  { id = "rust.winres",     api = "winres build dep",   re = '^\s*winres\s*=', lang = ["toml"], msg = "winres build-dep (embed Windows .exe metadata).", cat = "build", sev = "info" },
