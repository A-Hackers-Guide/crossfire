  { id = "py.winapi",     api = "_winapi",     re = '^\s*import\s+_winapi\b|\bctypes\.windll\.(kernel32|user32|advapi32|shell32|ole32)\b', msg = "Low-level Win32 via ctypes/_winapi." },
  { id = "py.win32com",   api = "win32com / pywin32", re = '^\s*import\s+(win32com|win32api|win32con|win32gui|pywintypes|pythoncom)\b', msg = "pywin32 / COM automation.", sev = "blocker" },
  { id = "py.winpath",    api = "PureWindowsPath", re = '\bPureWindowsPath\s*\(|\bos\.path\.(splitunc|splitdrive)\s*\(', msg = "Windows-only pathlib / os.path helpers.", sev = "low", cat = "filesystem" },
  { id = "py.msvcrt.getch", api = "msvcrt.getch / kbhit", re = '\bmsvcrt\.(getch|getwch|kbhit|putch)\b', msg = "msvcrt console helpers.", cat = "input" },
