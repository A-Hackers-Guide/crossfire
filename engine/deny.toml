# cargo-deny configuration.
#
# Runs in CI (.github/workflows/lint.yml). Policies kept intentionally loose
# at the start — we fail only on hard problems (unmaintained crates with no
# fix path, strongly incompatible licenses, yanked versions). Tighten here
# when you want to enforce more.

[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Allow the usual OSS licenses we already depend on through the tree.
# Add new ones here when a new dependency needs them.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MPL-2.0",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
