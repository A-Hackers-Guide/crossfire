[package]
name = "crossfire"
version = "0.1.0"
description = "Port any project between Windows, macOS, Linux and FreeBSD"
edition = "2021"
license = "MIT"

[lib]
name = "crossfire_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
crossfire-engine = { path = "../../../engine" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
